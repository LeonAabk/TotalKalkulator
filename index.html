<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Kalkulator - Leon Aabak</title>
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
    <script data-goatcounter="https://leonaabak.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>

    <header class="header-container">
        <button class="header-logo" onclick="showHome()">Total Kalkulator</button>
        <p class="author-tag">Leon Aabak</p>
    </header>

    <nav id="theme-selector" aria-label="Velg fargetema">
        <button class="theme-dot" style="background: #00d2ff" onclick="setTheme('#00d2ff', '#3a7bd5', 0)" aria-label="Blått tema"></button>
        <button class="theme-dot" style="background: #00ff87" onclick="setTheme('#00ff87', '#60efff', 1)" aria-label="Grønt tema"></button>
        <button class="theme-dot" style="background: #e000ff" onclick="setTheme('#e000ff', '#7000ff', 2)" aria-label="Lilla tema"></button>
        <button class="theme-dot" style="background: #ff8c00" onclick="setTheme('#ff8c00', '#e52d27', 3)" aria-label="Oransje tema"></button>
        <button class="theme-dot" style="background: #ff69b4" onclick="setTheme('#ff69b4', '#ffb6c1', 4)" aria-label="Rosa tema"></button>
    </nav>

    <main>
        <section id="search-container">
            <label for="search-bar" class="visually-hidden">Søk i funksjoner</label>
            <input type="text" id="search-bar" placeholder="🔍 Søk i alle 55 funksjoner...">
        </section>

        <div class="hoved-layout">
            
            <div class="venstre-kolonne">
                <section id="folder-view" class="grid-container"></section>
                <section id="list-view" class="grid-container" style="display: none;"></section>

                <article id="calc-view" class="glass-panel" style="display: none;">
                    <nav style="display: flex;">
                        <button class="back-btn" onclick="showHome()">← Hjem</button>
                        <button class="back-btn" id="btn-back-list">← Tilbake</button>
                    </nav>
                    <h2 id="calc-title" style="margin-bottom: 15px; color: var(--primary);"></h2>
                    <div id="pre-calc-formula" aria-live="polite"></div>
                    
                    <div id="input-container"></div>
                    <button class="action-btn" onclick="executeCalc()">Regn ut (Enter)</button>
                    
                    <section id="result-container">
                        <div id="result-box" role="status"></div>
                        <div id="explanation-box"></div>
                        <div id="graph-container"><canvas id="graphCanvas"></canvas></div>
                        <button onclick="copyResult()" style="margin-top: 25px; background: none; border: 1px solid var(--primary); color: var(--primary); padding: 8px; border-radius: 5px; cursor: pointer;">Kopier svar</button>
                    </section>
                </article>
            </div>

            <aside class="hoyre-kolonne">
                
                <div id="hurtig-graf-panel" class="glass-panel verktoy-boks">
                    <h3 style="color: var(--primary); margin-bottom: 10px; font-size: 1.1rem;">📉 Hurtig-Graf</h3>
                    <input type="text" id="hurtigGrafInput" placeholder="f.eks. x*x - 4" style="margin-bottom: 10px; padding: 8px; font-family: monospace;">
                    <canvas id="hurtigCanvas" width="250" height="150" style="background: #000; border-radius: 5px; width: 100%; border: 1px solid rgba(255,255,255,0.1);"></canvas>
                </div>

                <div id="enhetssirkel-panel" class="glass-panel verktoy-boks">
                    <h3 style="color: var(--primary); margin-bottom: 10px; font-size: 1.1rem;">⭕ Enhetssirkel</h3>
                    <canvas id="enhetssirkel" width="250" height="250" style="background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 250px; display: block; margin: 0 auto; box-shadow: none;"></canvas>
                    
                    <div class="kontroller" style="margin-top: 15px;">
                        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">
                            <label for="vinkelInput" style="font-size: 0.9rem; color: #ccc;">Vinkel (°):</label>
                            <input type="number" id="vinkelInput" value="45" min="-360" max="360" style="padding: 6px; width: 70px; text-align: center; border-radius: 5px; border: 1px solid var(--primary); background: transparent; color: inherit; font-size: 1rem; margin-bottom: 0;">
                        </div>
                        
                        <div id="trig-resultater" style="display: flex; justify-content: space-around; font-size: 0.9rem; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 5px;">
                            <p>Sin: <span id="sinVerdi" style="font-weight: bold; color: var(--primary);">-</span></p>
                            <p>Cos: <span id="cosVerdi" style="font-weight: bold; color: var(--primary);">-</span></p>
                        </div>
                    </div>
                </div>
                <div id="prosjektil-panel" class="glass-panel verktoy-boks">
                    <h3 style="color: var(--primary); margin-bottom: 10px; font-size: 1.1rem;">🚀 Kastbane</h3>
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <input type="number" id="fartInput" placeholder="Fart (m/s)" value="15" style="width: 50%; font-size: 0.9rem; padding: 8px;">
                        <input type="number" id="kastvinkelInput" placeholder="Vinkel (°)" value="45" style="width: 50%; font-size: 0.9rem; padding: 8px;">
                    </div>
                    <canvas id="prosjektilCanvas" width="250" height="150" style="background: rgba(255,255,255,0.05); border-radius: 5px; width: 100%; border: 1px solid rgba(255,255,255,0.1);"></canvas>
                    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #ccc; margin-top: 10px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 5px;">
                        <span>Lengde: <b id="kastLengde" style="color: var(--primary);">0 m</b></span>
                        <span>Høyde: <b id="kastHoyde" style="color: var(--primary);">0 m</b></span>
                    </div>
                </div>

                <section id="history-panel" class="glass-panel verktoy-boks" style="padding: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3 style="color: var(--primary); font-size: 1.1rem;">🕒 Historikk</h3>
                        <button class="clear-history" onclick="clearHistory()">🗑️ Tøm</button>
                    </div>
                    <div id="history-list" style="max-height: 250px; overflow-y: auto;"><i>Ingen historikk enda.</i></div>
                </section>

            </aside>
        </div>
    </main>

    <div id="toast" role="alert">Kopiert! ✅</div>
    
    <footer class="footer">
        <p>Total Kalk © 2026 | Leon Aabak</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
